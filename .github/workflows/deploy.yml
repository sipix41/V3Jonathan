name: Deploy to Web Hosting Canada (WHC)

on:
  push:
    branches:
      - main # Le déploiement s'activera automatiquement lors d'un push sur la branche 'main'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Aligné avec la version choisie sur WHC (22.22.2)

      - name: 📦 Installation des dépendances
        run: npm ci

      - name: 🔨 Build du projet
        run: npm run build

      # Déploiement via FTP vers votre hébergement WHC
      - name: 🚀 Déploiement FTP vers WHC
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          # On déploie le dossier complet (sauf exclusions ci-dessous)
          local-dir: ./
          # On envoie à la racine du compte FTP (qui sera configuré pour pointer sur toiture_app)
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/src/**
            **/.github/**
            .env*
            README.md
            ./index.html
            *.tsx
            *.ts
            ./components/**
            ./pages/**
            ./public/**
