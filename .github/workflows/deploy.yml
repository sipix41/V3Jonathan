name: Deploy to Web Hosting Canada (WHC)

on:
  push:
    branches:
      - main # Le déploiement s'activera automatiquement lors d'un push sur la branche 'main'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Aligné avec la version choisie sur WHC (22.22.2)

      - name: 📦 Installation des dépendances
        run: npm ci

      - name: 🔨 Build du projet
        run: npm run build

      - name: 🔄 Préparer le redémarrage (Passenger)
        run: |
          mkdir -p tmp
          date > tmp/restart.txt

      # Déploiement via FTP vers votre hébergement WHC
      - name: 🚀 Déploiement FTP vers WHC
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          # On déploie le dossier complet (sauf exclusions ci-dessous)
          local-dir: ./
          # On envoie dans le dossier de l'application (toiture_app)
          server-dir: toiture_app/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/src/**
            **/.github/**
            .env*
            README.md
            index.html
            *.tsx
            *.ts
            components/**
            pages/**
            public/**

      # Redémarrage de l'application Node.js sur cPanel via FTP
      # On utilise un script FTP ou SSH ? On n'a que FTP. 
      # FTP-Deploy-Action ne permet pas d'exécuter des commandes.
      # Mais on peut uploader un fichier tmp/restart.txt mis à jour !
