name: Deploy to Web Hosting Canada (WHC)

on:
  push:
    branches:
      - main # Le déploiement s'activera automatiquement lors d'un push sur la branche 'main'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Aligné avec la version choisie sur WHC (22.22.2)

      - name: 📦 Installation des dépendances
        run: npm ci

      - name: 🔨 Build du projet
        run: npm run build

      - name: 🔄 Préparer le déploiement (Passenger & Nettoyage)
        run: |
          mkdir -p tmp
          date > tmp/restart.txt
          # On supprime les fichiers sources locaux pour ne pas les uploader sur le serveur
          rm -rf src components pages public
          rm -f index.html *.tsx *.ts README.md .env*

      # Déploiement via FTP vers votre hébergement WHC
      - name: 🚀 Déploiement FTP vers WHC
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          # Le dossier local à uploader
          local-dir: ./
          # On envoie dans le dossier courant du compte FTP (qui pointe déjà sur toiture_app)
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**

      # Redémarrage de l'application Node.js sur cPanel via FTP
      # On utilise un script FTP ou SSH ? On n'a que FTP. 
      # FTP-Deploy-Action ne permet pas d'exécuter des commandes.
      # Mais on peut uploader un fichier tmp/restart.txt mis à jour !
